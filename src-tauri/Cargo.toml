[package]
name = "Fermata"
version = "0.1.0"
description = "Productivity timer app"
authors = ["Matthew Fernando"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2.4.5"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-process = "2.3.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.12.0"

# Native access to the menu bar item, for coloring its title red
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSAttributedString", "NSDictionary", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSAttributedString", "NSButton", "NSColor", "NSControl", "NSFont", "NSResponder", "NSStatusBarButton", "NSStatusItem", "NSView"] }
